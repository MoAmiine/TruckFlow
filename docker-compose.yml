services:
  mongodb:
    image: mongo:6.0
    container_name: truckflow_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: truckflow_api
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://mongodb:27017/truckflow
      - JWT_SECRET=votre_secret_key
      - JWT_REFRESH_SECRET=votre_refresh_secret
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data: